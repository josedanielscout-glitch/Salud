                                                <div className={`p-3 rounded-2xl bg-white shadow-sm ${cat.color}`}>
                                                    <Icon name={cat.icono} size={24} />
                                                </div>
                                                <h3 className="font-black text-slate-800 text-lg">{cat.categoria}</h3>
                                            </div>
                                            <ul className="space-y-4">
                                                {cat.sintomas.map((sintoma, sIdx) => (
                                                    <li key={sIdx} className="flex items-start gap-3">
                                                        <div className={`mt-1.5 w-1.5 h-1.5 rounded-full shrink-0 ${cat.color.replace('text', 'bg').replace('600', '500').replace('500', '400')}`}></div>
                                                        <p className="text-slate-700 text-sm font-bold leading-relaxed">{sintoma}</p>
                                                    </li>
                                                ))}
                                            </ul>
                                        </div>
                                    ))}
                                </div>

                                <div className="bg-red-600 p-8 rounded-[2.5rem] text-white shadow-2xl shadow-red-100 flex flex-col md:flex-row items-center gap-8 border-4 border-red-500">
                                    <div className="bg-white/20 p-6 rounded-full animate-pulse shrink-0">
                                        <Icon name="siren" size={64} color="white" />
                                    </div>
                                    <div className="space-y-2">
                                        <h3 className="text-2xl font-black uppercase tracking-tight">Acción Inmediata</h3>
                                        <p className="text-red-100 font-bold text-lg leading-snug">No esperes a que los síntomas pasen por sí solos. En emergencias, cada minuto cuenta para preservar tu salud e integridad física.</p>
                                        <p className="text-sm font-medium opacity-80 pt-2 tracking-wide uppercase font-black italic">Consultar inmediatamente con su red de salud más cercana.</p>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Modal Detalle */}
                    {(selectedDisease || selectedHabit) && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6 bg-slate-900/90 backdrop-blur-md animate-fade">
                            <div className="bg-white w-full max-w-2xl rounded-[3rem] p-10 max-h-[90vh] overflow-y-auto no-scrollbar shadow-2xl border border-white/20">
                                <div className="flex justify-between items-start mb-10">
                                    <div className="flex-1 pr-6">
                                        <span className="text-[11px] font-black text-blue-600 bg-blue-50 px-4 py-1.5 rounded-full uppercase tracking-[0.2em]">Ficha Informativa Salud UCN</span>
                                        <h2 className="text-4xl font-black mt-4 text-slate-800 leading-tight tracking-tight">{selectedDisease ? selectedDisease.nombre : selectedHabit.titulo}</h2>
                                    </div>
                                    <button onClick={() => { setSelectedDisease(null); setSelectedHabit(null); }} className="bg-slate-100 p-3 rounded-full hover:bg-red-50 hover:text-red-500 transition-all active:scale-90">✕</button>
                                </div>

                                <div className="space-y-8 pb-4">
                                    {selectedDisease ? (
                                        <React.Fragment>
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                                <section className="bg-slate-50 p-7 rounded-[2rem] border border-slate-100">
                                                    <h4 className="flex items-center gap-3 font-black uppercase text-[10px] text-blue-600 mb-4 tracking-widest">
                                                        <Icon name="search" size={18} /> Detección de Síntomas
                                                    </h4>
                                                    <p className="text-sm leading-relaxed text-slate-700 font-bold">{selectedDisease.deteccion}</p>
                                                </section>
                                                <section className="bg-green-50 p-7 rounded-[2rem] border border-green-100">
                                                    <h4 className="flex items-center gap-3 font-black uppercase text-[10px] text-green-700 mb-4 tracking-widest">
                                                        <Icon name="shield" size={18} /> Protocolo Prevención
                                                    </h4>
                                                    <p className="text-sm leading-relaxed text-green-800 font-bold">{selectedDisease.prevencion}</p>
                                                </section>
                                            </div>
                                            <section className="bg-blue-600 p-8 rounded-[2rem] text-white shadow-xl shadow-blue-100">
                                                <h4 className="flex items-center gap-3 font-black uppercase text-[10px] text-blue-200 mb-4 tracking-widest">
                                                    <Icon name="activity" size={18} color="white" /> Plan de Acción Sugerido
                                                </h4>
                                                <p className="text-lg leading-relaxed font-extrabold">{selectedDisease.queHacer}</p>
                                            </section>
                                            <div className="bg-amber-50 border border-amber-200 p-6 rounded-[2rem] flex gap-5">
                                                <div className="shrink-0 mt-0.5"><Icon name="alert" color="#d97706" size={24} /></div>
                                                <div>
                                                    <p className="text-[11px] text-amber-900 font-black uppercase leading-tight tracking-tight mb-1">Aviso de Seguridad Médica</p>
                                                    <p className="text-xs text-amber-800 font-medium leading-relaxed italic">Salud UCN: Esta ficha es orientativa. No sustituye la consulta médica profesional. Evite la automedicación bajo cualquier circunstancia.</p>
                                                </div>
                                            </div>
                                        </React.Fragment>
                                    ) : (
                                        <div className="space-y-10">
                                            <div className="flex justify-center py-12 bg-slate-50 rounded-[3rem] mb-4">
                                                <div className="scale-[2.5]">{selectedHabit.icono}</div>
                                            </div>
                                            <section className="bg-indigo-900 p-10 rounded-[3rem] border border-indigo-800 shadow-2xl">
                                                <h4 className="font-black uppercase text-[11px] text-indigo-300 mb-6 tracking-widest flex items-center gap-3">
                                                    <Icon name="zap" size={20} color="#a5b4fc" /> Fundamentos de Bienestar
                                                </h4>
                                                <p className="text-2xl leading-relaxed text-white font-black italic tracking-tight">"{selectedHabit.detalles}"</p>
                                            </section>
                                        </div>
                                    )}
                                    <button onClick={() => { setSelectedDisease(null); setSelectedHabit(null); }} className="w-full bg-slate-900 hover:bg-black text-white py-6 rounded-2xl font-black shadow-xl active:scale-95 transition-all uppercase tracking-[0.2em] mt-6">Entendido</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

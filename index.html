        body {

            background: linear-gradient(180deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 100%);
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .animate-float { animation: float 6s ease-in-out infinite; }
        
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.9) translateY(10px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        .animate-pop { animation: popIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        /* Para navegadores basados en Firefox */
        html {

                        <button onClick={() => setView('recommendations')} className={`p-4 rounded-[1.5rem] transition-all flex items-center justify-center ${view === 'recommendations' ? 'bg-gradient-to-r from-purple-400 to-pink-500 text-white shadow-glow-purple' : 'text-slate-500 hover:bg-purple-50 hover:text-purple-500'}`}><SVGIcon name="user" size={24} /></button>
                        <button onClick={() => setView('alarms')} className={`p-4 rounded-[1.5rem] transition-all flex items-center justify-center ${view === 'alarms' ? 'bg-gradient-to-r from-red-500 to-rose-600 text-white shadow-glow-red' : 'text-slate-500 hover:bg-red-50 hover:text-red-500'}`}><SVGIcon name="siren" size={24} /></button>
                        <button onClick={() => setView('firstaid')} className={`p-4 rounded-[1.5rem] transition-all flex items-center justify-center ${view === 'firstaid' ? 'bg-gradient-to-r from-emerald-500 to-teal-600 text-white shadow-glow-emerald' : 'text-slate-500 hover:bg-emerald-50 hover:text-emerald-600'}`}><SVGIcon name="aidKit" size={24} /></button>
                    </nav>

                    {/* MODAL INTERACTIVO RESTAURADO */}
                    {(selectedDisease || selectedHabit || selectedFirstAid) && (
                        <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 bg-slate-900/60 backdrop-blur-md animate-fade">
                            <div className="bg-white/90 backdrop-blur-xl w-full max-w-2xl rounded-t-[3rem] sm:rounded-[2.5rem] p-8 sm:p-10 max-h-[92vh] overflow-y-auto no-scrollbar shadow-3d border border-white">
                                <div className="w-12 h-1.5 bg-slate-300 rounded-full mx-auto mb-6 sm:hidden"></div>
                                
                                <div className="flex justify-between items-start mb-8">
                                    <div className="flex-1 pr-6">
                                        <span className="text-[10px] font-black text-blue-600 bg-blue-100 px-4 py-1.5 rounded-full uppercase tracking-widest shadow-sm">
                                            {selectedDisease ? 'Ficha Médica' : selectedFirstAid ? 'Emergencias' : 'Hábito Saludable'}
                                        </span>
                                        <h2 className="text-3xl font-black mt-4 text-slate-800 leading-tight drop-shadow-sm">
                                            {selectedDisease?.nombre || selectedFirstAid?.nombre || selectedHabit?.titulo}
                                        </h2>
                                    </div>
                                    <button onClick={() => { setSelectedDisease(null); setSelectedHabit(null); setSelectedFirstAid(null); }} className="bg-white p-3 rounded-full shadow-md text-slate-400 hover:text-red-500 hover:bg-red-50 transition-all active:scale-90 flex items-center justify-center">
                                        ✕
                                    </button>
                                </div>

                                <div className="space-y-6 pb-8">
                                    {selectedDisease && (
                                        <React.Fragment>
                                            <section className="bg-white/80 p-6 rounded-[2rem] border border-slate-100 shadow-sm">
                                                <h4 className="flex items-center gap-3 font-black uppercase text-[10px] text-blue-600 mb-4 tracking-widest">
                                                    <SVGIcon name="search" size={18} color="currentColor" /> Detección de Síntomas
                                                </h4>
                                                <p className="text-sm leading-relaxed text-slate-700 font-bold">{selectedDisease.deteccion}</p>
                                            </section>
                                            <section className="bg-white/80 p-6 rounded-[2rem] border border-green-100 shadow-sm">
                                                <h4 className="flex items-center gap-3 font-black uppercase text-[10px] text-green-600 mb-4 tracking-widest">
                                                    <SVGIcon name="shield" size={18} color="currentColor" /> Protocolo de Prevención
                                                </h4>
                                                <p className="text-sm leading-relaxed text-green-700 font-bold">{selectedDisease.prevencion}</p>
                                            </section>
                                            <section className="bg-gradient-to-r from-blue-500 to-blue-600 p-8 rounded-[2rem] text-white shadow-glow-blue">
                                                <h4 className="flex items-center gap-3 font-black uppercase text-[10px] text-blue-100 mb-4 tracking-widest">
                                                    <SVGIcon name="activity" size={18} color="currentColor" /> Plan de Acción Sugerido
                                                </h4>
                                                <p className="text-lg leading-relaxed font-extrabold">{selectedDisease.queHacer}</p>
                                            </section>
                                            <div className="bg-amber-50 border border-amber-200 p-6 rounded-[2rem] flex gap-5 shadow-sm">
                                                <div className="shrink-0 mt-1 text-amber-600"><SVGIcon name="alert" size={24} color="currentColor" /></div>
                                                <div>
                                                    <p className="text-[11px] text-amber-900 font-black uppercase leading-tight tracking-widest mb-1">Aviso de Seguridad Médica</p>
                                                    <p className="text-xs text-amber-800 font-semibold leading-relaxed italic">Salud UCN: Esta ficha es orientativa. Evite la automedicación. Todo tratamiento debe ser indicado por un médico colegiado.</p>
                                                </div>
                                            </div>
                                        </React.Fragment>
                                    )}

                                    {selectedFirstAid && (
                                        <div className="space-y-6">
                                            <div className="flex justify-center py-6">
                                                <Icon3D name={selectedFirstAid.icono} gradient={selectedFirstAid.gradient} shadow={selectedFirstAid.shadow} size={48} />
                                            </div>
                                            <div className="bg-white/90 p-8 rounded-[2rem] border border-slate-100 shadow-sm space-y-4">
                                                <h4 className="font-black uppercase text-[11px] text-slate-800 mb-6 tracking-widest flex items-center gap-2">
                                                    <SVGIcon name="activity" size={18} /> Pasos de Acción Inmediata
                                                </h4>
                                                <ul className="space-y-5">
                                                    {selectedFirstAid.pasos.map((paso, i) => (
                                                        <li key={i} className="flex items-start gap-4">
                                                            <div className="flex items-center justify-center w-7 h-7 rounded-full bg-gradient-to-br from-slate-800 to-slate-900 text-white font-black text-xs shrink-0 shadow-md">{i + 1}</div>
                                                            <p className="text-sm font-bold text-slate-700 leading-relaxed mt-0.5">{paso}</p>
                                                        </li>
                                                    ))}
                                                </ul>
                                            </div>
                                        </div>
                                    )}

                                    {selectedHabit && (
                                        <div className="space-y-8">
                                            <div className="flex justify-center py-6">
                                                <Icon3D name={selectedHabit.icono} gradient={selectedHabit.gradient} shadow={selectedHabit.shadow} size={48} />
                                            </div>
                                            <section className="bg-white/90 p-8 rounded-[2rem] border border-slate-100 shadow-sm">
                                                <h4 className="font-black uppercase text-[11px] text-slate-800 mb-6 tracking-widest flex items-center gap-3">
                                                    <SVGIcon name="zap" size={20} color="currentColor" /> Fundamentos de Bienestar
                                                </h4>
                                                <p className="text-xl leading-relaxed text-slate-700 font-bold italic">"{selectedHabit.detalles}"</p>
                                            </section>
                                        </div>
                                    )}

                                    <button onClick={() => { setSelectedDisease(null); setSelectedHabit(null); setSelectedFirstAid(null); }} className="w-full bg-slate-900 hover:bg-slate-800 text-white py-6 rounded-2xl font-black shadow-xl active:scale-95 transition-all uppercase tracking-[0.2em] mt-8">
                                        Cerrar Ficha
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
